name: RF performance
on:
  workflow_dispatch:
    inputs:
      profile:
        type: boolean
        default: false
        description: Collect macOS CPU stacks during the strict test
permissions:
  contents: read
jobs:
  # Spectrum CPU before (72183a2, radix-2 FFT with a bit-reversed load) and
  # after the radix-4 FFT, on each platform's own compiler and flags: the
  # portable path is what Linux and Windows run. Diagnostic: never fails on
  # the numbers.
  spectrum:
    name: Spectrum CPU ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Header before the radix-4 FFT
        shell: bash
        run: mkdir -p spectrum-base && git show 72183a2:native/src/dsp.hpp > spectrum-base/dsp.hpp
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Build and run both revisions
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for rev in before after; do
            include=$([ "$rev" = before ] && echo spectrum-base || echo native/src)
            c++ -std=c++20 -O3 -DNDEBUG -I"$include" native/tests/spectrum_benchmark.cpp -o "spectrum-$rev"
            echo "$rev $(./spectrum-$rev)" | tee -a spectrum-results.txt
          done
      - name: Build and run both revisions (MSYS2 UCRT)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          for rev in before after; do
            include=$([ "$rev" = before ] && echo spectrum-base || echo native/src)
            c++ -std=c++20 -O3 -DNDEBUG -I"$include" native/tests/spectrum_benchmark.cpp -o "spectrum-$rev"
            echo "$rev $(./spectrum-$rev)" | tee -a spectrum-results.txt
          done
      - name: Summary
        shell: bash
        run: |
          {
            echo "### Spectrum CPU at 20 MS/s, ${{ matrix.runner }} (best of 5, % of one core)"
            echo '```'
            cat spectrum-results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  gps:
    name: GPS ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libfftw3-dev libusb-1.0-0-dev libgcrypt20-dev
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config fftw libusb libgcrypt
      - run: python -m pip install -r native/tests/independent/requirements.txt
      - run: node scripts/prepare-gps.mjs
      - run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release -DAIRWOLF_WITH_DISSECTOR=OFF -DAIRWOLF_WITH_HACKRF=OFF -DAIRWOLF_WITH_LTE=OFF -DAIRWOLF_WITH_LORA=OFF
      - run: cmake --build native/build --target airwolf-gps-benchmark airwolf-gps-transport-tests airwolf-gps-filter-tests --parallel 3
      - run: ctest --test-dir native/build -R native-gps-filter --output-on-failure
      - name: Compare GPS FIR implementations on the same runner
        run: mkdir -p test-results && native/build/gps/airwolf-gps-filter-tests --benchmark > test-results/gps-performance-filter.json
      - name: Unrestricted real-time GPS benchmark
        run: python native/gps/tests/benchmark.py native/build/gps/airwolf-gps-benchmark native/build/gps/airwolf-gps-transport-tests --output test-results/gps-performance.json --require-realtime --repetitions 3 ${{ inputs.profile && runner.os == 'macOS' && '--profile' || '' }}
      - name: Recover a 750 ms worker pause without losing GPS samples
        if: always() && !cancelled()
        run: python native/gps/tests/benchmark.py native/build/gps/airwolf-gps-benchmark native/build/gps/airwolf-gps-transport-tests --output test-results/gps-performance-stall.json --require-realtime --stall-ms 750
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gps-performance-${{ matrix.runner }}
          path: test-results/gps-performance*
